<style>
:root {
  /* Default: Light Neumorphic Warm Theme */
  --bg: #f4f0e6;
  --card-bg: #f4f0e6;
  --card-border: rgba(255, 255, 255, 0.45);
  
  --ink: #3d3425;
  --ink-soft: #706351;
  --ink-faint: #9c8e7b;
  
  --accent-coral: #e59a85;
  --accent-teal: #9ec6b8;
  --accent-blue: #b4cdd4;
  --accent-color: #d67b65;
  
  /* Neumorphic Shadows */
  --shadow-dark: 12px 12px 24px #e0dad0;
  --shadow-light: -12px -12px 24px #ffffff;
  
  --shadow-hover-dark: 16px 16px 32px #d7cfc3;
  --shadow-hover-light: -16px -16px 32px #ffffff;
  
  --shadow-inset-dark: inset 6px 6px 12px #e0dad0;
  --shadow-inset-light: inset -6px -6px 12px #ffffff;
  
  --shadow-button-dark: 6px 6px 12px #e0dad0;
  --shadow-button-light: -6px -6px 12px #ffffff;
  
  --shadow-button-inset-dark: inset 4px 4px 8px #e0dad0;
  --shadow-button-inset-light: inset -4px -4px 8px #ffffff;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

[data-theme="dark"] {
  /* Dark Neumorphic Carbon/Obsidian Theme */
  --bg: #1f211f;
  --card-bg: #1f211f;
  --card-border: rgba(255, 255, 255, 0.015);
  
  --ink: #ecebeb;
  --ink-soft: #a6a6a6;
  --ink-faint: #707070;
  
  --accent-coral: #f2ad99;
  --accent-teal: #bce0d5;
  --accent-blue: #cce0e5;
  --accent-color: #f2ad99;
  
  /* Neumorphic Shadows */
  --shadow-dark: 12px 12px 24px #141614;
  --shadow-light: -12px -12px 24px #2a2c2a;
  
  --shadow-hover-dark: 16px 16px 32px #0f100f;
  --shadow-hover-light: -16px -16px 32px #2f322f;
  
  --shadow-inset-dark: inset 6px 6px 12px #141614;
  --shadow-inset-light: inset -6px -6px 12px #2a2c2a;
  
  --shadow-button-dark: 6px 6px 12px #141614;
  --shadow-button-light: -6px -6px 12px #2a2c2a;
  
  --shadow-button-inset-dark: inset 4px 4px 8px #141614;
  --shadow-button-inset-light: inset -4px -4px 8px #2a2c2a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  transition: background-color 0.4s ease, color 0.4s ease;
  min-height: 100vh;
  padding: 2rem 1.5rem;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 480px 1fr;
  gap: 2.5rem;
}

@media (max-width: 950px) {
  .container {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 32px;
  padding: 2.2rem;
  box-shadow: var(--shadow-dark), var(--shadow-light);
  display: flex;
  flex-direction: column;
  gap: 2rem;
  height: fit-content;
}

.preview-panel {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

header {
  text-align: center;
  margin-bottom: 0.5rem;
}

h1 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

p.subtitle {
  font-size: 0.9rem;
  color: var(--ink-soft);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 600;
}

input[type="text"], input[type="password"], textarea, select {
  background: var(--bg);
  border: none;
  border-radius: 14px;
  padding: 0.9rem 1.2rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--ink);
  box-shadow: var(--shadow-inset-dark), var(--shadow-inset-light);
  outline: none;
  transition: all 0.3s ease;
}

input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
  box-shadow: var(--shadow-inset-dark), var(--shadow-inset-light), 0 0 0 2px var(--accent-coral);
}

.row {
  display: flex;
  gap: 1rem;
}

.row > * {
  flex: 1;
}

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.85rem;
  color: var(--ink-soft);
}

.checkbox-group input {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-coral);
  cursor: pointer;
}

.drop-zone {
  border: 2px dashed var(--accent-teal);
  border-radius: 20px;
  padding: 2.2rem;
  text-align: center;
  background: var(--bg);
  box-shadow: var(--shadow-button-dark), var(--shadow-button-light);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  color: var(--ink-soft);
}

.drop-zone.dragover {
  box-shadow: var(--shadow-inset-dark), var(--shadow-inset-light);
  background: rgba(158, 198, 184, 0.08);
}

.drop-zone p {
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

.drop-zone svg {
  width: 32px;
  height: 32px;
  fill: var(--accent-teal);
}

button.btn {
  display: inline-flex;
  align-items: center;

  gap: 0.6rem;
  padding: 0.9rem 1.8rem;
  border-radius: 50px;

  background: var(--card-bg);

  cursor: pointer;

  outline: none;
}

button.btn:hover {

  color: var(--accent-color);
}

button.btn-primary {

}

button.btn-primary:hover {

}

button:disabled {

}

.status-bar {

  gap: 0.6rem;

}

iframe {

.theme-toggle-btn {

<script>
// Configure PDF.js Worker safely
let pdfjsLib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
if (pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// Setup local key storage and visibility toggle
const apiKeyInput = document.getElementById('apiKey');
const saveKeyCheckbox = document.getElementById('saveKey');
const toggleKeyVisibilityBtn = document.getElementById('toggleKeyVisibility');

if (toggleKeyVisibilityBtn) {
  toggleKeyVisibilityBtn.addEventListener('click', () => {
    if (apiKeyInput.type === 'password') {
      apiKeyInput.type = 'text';
      toggleKeyVisibilityBtn.textContent = 'Hide';
    } else {
      apiKeyInput.type = 'password';
      toggleKeyVisibilityBtn.textContent = 'Show';
    }
  });
}

function initKey() {
  const savedKey = localStorage.getItem('gemini_api_key');
  if (savedKey) {
    // If user accidentally stored corrupted multiline resume as key, clear it
    if (savedKey.includes('\n') || savedKey.length > 100 || savedKey.includes(' ')) {
      localStorage.removeItem('gemini_api_key');
      apiKeyInput.value = '';
    } else {
      apiKeyInput.value = savedKey;
    }
  }
}
initKey();
window.addEventListener('DOMContentLoaded', initKey);

// Dropzone file interactions
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileLabel = document.getElementById('fileLabel');
const resumeText = document.getElementById('resumeText');

dropZone.addEventListener('click', () => fileInput.click());

// Prevent default drag behaviors for all drag events
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, (e) => {
    e.preventDefault();
    e.stopPropagation();
  }, false);
});

dropZone.addEventListener('dragenter', () => {
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragover', () => {
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', (e) => {
  dropZone.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length > 0) {
    handleFile(files[0]);
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    handleFile(fileInput.files[0]);
  }
});

let loadedFile = null;

async function handleFile(file) {
  loadedFile = file;
  fileLabel.innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
  
  if (file.type === "text/plain" || file.name.endsWith(".txt")) {
    const text = await parseTXT(file);
    resumeText.value = text;
  } else if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
    try {
      fileLabel.innerText = "Parsing PDF...";
      const text = await parsePDF(file);
      resumeText.value = text;
      fileLabel.innerText = `${file.name} (Successfully parsed)`;
    } catch (err) {
      showError(`PDF parse error: ${err.message}. Make sure the PDF contains readable text.`);
      fileLabel.innerText = "Failed to parse PDF";
    }
  } else {
    showError("Unsupported file type. Please upload a .pdf or .txt file.");
    fileLabel.innerText = "Unsupported file type";
  }
}

async function parseTXT(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

async function parsePDF(file) {
  const currentPdfjs = window.pdfjsLib || window['pdfjs-dist/build/pdf'] || pdfjsLib;
  if (!currentPdfjs) {
    throw new Error("PDF.js library is not loaded. Please ensure you are connected to the internet to load the PDF parser, or copy and paste the resume text below.");
  }
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await currentPdfjs.getDocument({ data: arrayBuffer }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    text += pageText + '\n';
  }
  if (!text.trim()) {
    throw new Error("No text was extracted. The PDF might be scanned/image-only.");
  }
  return text;
}

// Custom theme toggle for generator app itself
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
});

// Render function
function renderPortfolio(data, cssString) {
  const name = data.name || "Untitled Portfolio";
  const headline = data.headline || "";
  const summary = data.summary || "";
  const skills = Array.isArray(data.skills) ? data.skills : [];
  const education = Array.isArray(data.education) ? data.education : [];
  const experience = Array.isArray(data.experience) ? data.experience : [];
  const projects = Array.isArray(data.projects) ? data.projects : [];
  const achievements = Array.isArray(data.achievements) ? data.achievements : [];
  
  const contact = data.contact || {};
  const email = contact.email || "";
  const phone = contact.phone || "";
  const linkedin = contact.linkedin || "";
  const github = contact.github || "";
  const links = Array.isArray(contact.links) ? contact.links : [];

  let contactHtml = "";
  if (email || phone || linkedin || github || links.length > 0) {
    contactHtml = `
      <div class="contact-section">
        <ul class="contact-list">
          ${email ? `<li><span class="contact-key">email</span><a href="mailto:${email}">${email}</a></li>` : ''}
          ${phone ? `<li><span class="contact-key">phone</span><a href="tel:${phone}">${phone}</a></li>` : ''}
          ${linkedin ? `<li><span class="contact-key">linkedin</span><a href="${linkedin}" target="_blank" rel="noopener">${linkedin.replace("https://www.linkedin.com/in/", "").replace("https://linkedin.com/in/", "").replace(/\/$/, "")}</a></li>` : ''}
          ${github ? `<li><span class="contact-key">github</span><a href="${github}" target="_blank" rel="noopener">${github.replace("https://github.com/", "").replace("https://www.github.com/", "").replace(/\/$/, "")}</a></li>` : ''}
          ${links.map(link => `<li><span class="contact-key">link</span><a href="${link}" target="_blank" rel="noopener">${link.replace("https://", "").replace("http://", "").replace("www.", "").replace(/\/$/, "")}</a></li>`).join('')}
        </ul>
      </div>`;
  }

  let skillsHtml = "";
  if (skills.length > 0) {
    skillsHtml = `
    <section class="glass-card">
      <h2 class="field-tag">Skills</h2>
      <ul class="chip-row">
        ${skills.map(skill => `<li class="chip">${skill}</li>`).join('')}
      </ul>
    </section>`;
  }

  let experienceHtml = "";
  if (experience.length > 0) {
    experienceHtml = `
    <section class="glass-card">
      <h2 class="field-tag">Experience</h2>
      <div class="timeline">
        ${experience.map(job => `
        <article class="timeline-item">
          <div class="timeline-head">
            <h3 class="timeline-title">
              ${job.role || ''} 
              ${job.organization ? `<span class="timeline-org">@ ${job.organization}</span>` : ''}
            </h3>
            ${job.duration ? `<span class="timeline-duration">${job.duration}</span>` : ''}
          </div>
          ${job.description ? `<p class="timeline-desc">${job.description}</p>` : ''}
        </article>`).join('')}
      </div>
    </section>`;
  }

  let projectsHtml = "";
  if (projects.length > 0) {
    projectsHtml = `
    <section class="glass-card">
      <h2 class="field-tag">Projects</h2>
      <div class="projects-grid">
        ${projects.map(project => `
        <article class="project-card">
          <h3 class="project-title">${project.title || ''}</h3>
          ${project.description ? `<p class="project-desc">${project.description}</p>` : ''}
          ${project.technologies && project.technologies.length > 0 ? `
          <ul class="chip-row chip-row--tight">
            ${project.technologies.map(tech => `<li class="chip chip--outline">${tech}</li>`).join('')}
          </ul>` : ''}
        </article>`).join('')}
      </div>
    </section>`;
  }

  let educationHtml = "";
  if (education.length > 0) {
    educationHtml = `
    <section class="glass-card">
      <h2 class="field-tag">Education</h2>
      <div class="timeline">
        ${education.map(entry => `
        <article class="timeline-item">
          <div class="timeline-head">
            <h3 class="timeline-title">${entry.institution || ''}</h3>
            ${entry.duration ? `<span class="timeline-duration">${entry.duration}</span>` : ''}
          </div>
          ${entry.qualification ? `<p class="timeline-desc">${entry.qualification}</p>` : ''}
        </article>`).join('')}
      </div>
    </section>`;
  }

  let achievementsHtml = "";
  if (achievements.length > 0) {
    achievementsHtml = `
    <section class="glass-card">
      <h2 class="field-tag">Achievements</h2>
      <ul class="achievements-list">
        ${achievements.map(item => `<li>${item}</li>`).join('')}
      </ul>
    </section>`;
  }

  return `<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${name}${headline ? ' — ' + headline : ''}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
${cssString}
</style>
<script>
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
<\/script>
</head>
<body>

<div class="spheres-container">
  <div class="sphere sphere-1"></div>
  <div class="sphere sphere-2"></div>
  <div class="sphere sphere-3"></div>
  <div class="sphere sphere-4"></div>
</div>

<div class="portfolio-container">

  <!-- Left Sidebar (Profile & Bio) -->
  <aside class="sidebar-wrapper">
    <div class="sidebar glass-card">
      <div class="profile-card">
        <p class="record-tag">// generated portfolio</p>
        <h1 class="name">${name}</h1>
        ${headline ? `<p class="headline">${headline}</p>` : ''}
        ${summary ? `<p class="bio-summary">${summary}</p>` : ''}

        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24" id="theme-icon-sun" style="display: none;">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z"/>
          </svg>
          <svg viewBox="0 0 24 24" id="theme-icon-moon" style="display: none;">
            <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.5-.1 1 .2 1.1.7.1.5-.2 1-.7 1.1-3.6.7-6.2 3.8-6.2 7.7 0 4.3 3.5 7.8 7.8 7.8 3.9 0 7-2.6 7.7-6.2.1-.5.6-.8 1.1-.7.5.1.8.6.7 1.1-.9 4.7-5 8.2-9.8 8.2z"/>
          </svg>
          <span id="theme-text">Toggle Theme</span>
        </button>
      </div>

      ${contactHtml}
    </div>
  </aside>

  <!-- Right Main Column (Sections Feed) -->
  <main class="content-feed">
    ${skillsHtml}
    ${experienceHtml}
    ${projectsHtml}
    ${educationHtml}
    ${achievementsHtml}
  </main>

</div>

<script>
  (function() {
    const toggleButton = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');
    const themeText = document.getElementById('theme-text');

    function updateIcons(theme) {
      if (theme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'inline-block';
        themeText.textContent = 'Dark Mode';
      } else {
        sunIcon.style.display = 'inline-block';
        moonIcon.style.display = 'none';
        themeText.textContent = 'Light Mode';
      }
    }

    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    updateIcons(currentTheme);

    toggleButton.addEventListener('click', () => {
      const theme = document.documentElement.getAttribute('data-theme');
      const nextTheme = theme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('theme', nextTheme);
      updateIcons(nextTheme);
    });
  })();
<\/script>

</body>
</html>`;
}

function buildPrompt(resumeText) {
  return `You extract structured portfolio data from ONE resume.

STRICT RULES:
- Use only information explicitly present in the resume text below.
- Do NOT invent or guess skills, experience, projects, achievements, companies, dates, or links.
- If a piece of information is missing, use an empty string "" or an empty list [], never a
  placeholder such as "N/A", "Not specified", or "Unknown".
- Keep the professional summary concise (2-3 sentences) and strictly factual.
- Return valid JSON only. No markdown, no code fences, no explanation, no extra text.

Return JSON matching exactly this structure and key names:
{
  "name": "string - full name",
  "headline": "string - short professional identity (e.g. role or field of study)",
  "summary": "string - concise, factual professional summary",
  "skills": ["string", "..."],
  "education": [
    {"institution": "string", "qualification": "string", "duration": "string"}
  ],
  "experience": [
    {"role": "string", "organization": "string", "duration": "string", "description": "string"}
  ],
  "projects": [
    {"title": "string", "description": "string", "technologies": ["string", "..."]}
  ],
  "achievements": ["string", "..."],
  "contact": {
    "email": "string", "phone": "string", "linkedin": "string", "github": "string",
    "links": ["string", "..."]
  }
}

RESUME TEXT:
"""
${resumeText}
"""
`;
}

// Generate Orchestration
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const previewFrame = document.getElementById('previewFrame');
const errorBox = document.getElementById('errorBox');

const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');

let generatedHtml = "";

function clearStatus() {
  step1.className = "status-item";
  step2.className = "status-item";
  step3.className = "status-item";
  errorBox.style.display = "none";
}

function showError(msg) {
  errorBox.innerText = msg;
  errorBox.style.display = "block";
  generateBtn.disabled = false;
  generateBtn.innerText = "Generate Portfolio";
}

generateBtn.addEventListener('click', async () => {
  const apiKey = apiKeyInput.value.trim();
  const text = resumeText.value.trim();

  if (!apiKey) {
    showError("Please enter your Gemini API key from Google AI Studio (starts with AIzaSy...).");
    return;
  }

  // Validate that the API key is not accidental resume text
  if (apiKey.includes('\n') || apiKey.length > 80 || apiKey.includes(' ') || apiKey.toLowerCase().includes('resume') || apiKey.toLowerCase().includes('skills') || apiKey.toLowerCase().includes('education')) {
    localStorage.removeItem('gemini_api_key');
    apiKeyInput.value = '';
    showError("The 'Gemini API Key' field contains invalid characters or looks like resume text! Please paste your actual Google AI Studio API key (starts with AIzaSy...) into the API key field, and paste your resume into the textarea below.");
    return;
  }

  if (saveKeyCheckbox.checked) {
    localStorage.setItem('gemini_api_key', apiKey);
  } else {
    localStorage.removeItem('gemini_api_key');
  }

  if (!text || text.length < 100) {
    showError("Please upload a resume file or paste resume details (minimum 100 characters).");
    return;
  }

  try {
    generateBtn.disabled = true;
    generateBtn.innerText = "Processing...";
    clearStatus();

    // Step 1: Parse resume file (Done already if pasted, or parse from cache)
    step1.classList.add('done');
    
    // Step 2: Request from Gemini
    step2.classList.add('active');
    const prompt = buildPrompt(text);
    
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain'
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.1
        }
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || `API HTTP error ${response.status}`);
    }

    const resData = await response.json();
    if (!resData.candidates || resData.candidates.length === 0) {
      throw new Error("No response candidates returned by Gemini.");
    }
    
    const rawJsonText = resData.candidates[0].content.parts[0].text;
    let portfolioData;
    try {
      portfolioData = JSON.parse(rawJsonText.trim());
    } catch (e) {
      throw new Error("Gemini returned invalid JSON: " + rawJsonText.substring(0, 100) + "...");
    }

    step2.classList.remove('active');
    step2.classList.add('done');

    // Step 3: Render portfolio HTML
    step3.classList.add('active');
    
    // Try to fetch style.css locally, fallback to embeddedCss if blocked or not found
    let finalCss = embeddedCss;
    try {
      const cssFetch = await fetch('style.css');
      if (cssFetch.ok) {
        finalCss = await cssFetch.text();
      }
    } catch (cssErr) {
      console.warn("Could not fetch style.css locally (expected under file:// protocol). Using embedded styles instead.", cssErr);
    }

    generatedHtml = renderPortfolio(portfolioData, finalCss);
    
    // Set iframe content safely
    previewFrame.srcdoc = generatedHtml;
    
    step3.classList.remove('active');
    step3.classList.add('done');
    
    // Enable download
    downloadBtn.disabled = false;
    generateBtn.disabled = false;
    generateBtn.innerText = "Generate Portfolio";

  } catch (err) {
    showError(err.message);
    step2.classList.remove('active');
    step3.classList.remove('active');
  }
});

// Download portfolio action
downloadBtn.addEventListener('click', () => {
  if (!generatedHtml) return;
  const blob = new Blob([generatedHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'portfolio.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
